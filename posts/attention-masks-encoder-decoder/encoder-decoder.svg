<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 820 710" width="820" height="710" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The original encoder-decoder Transformer</title><desc id="d">Encoder stack on the left with self-attention and feed-forward layers; decoder stack on the right with masked self-attention, cross-attention reading the encoder output as keys and values, and feed-forward layers; a final linear and softmax layer gives next-token probabilities.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0" y="140" width="820" height="710" fill="#ffffff"/><rect x="60" y="400" width="310" height="290" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="450" y="270" width="310" height="420" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 5"/><text x="72" y="418" font-size="12" text-anchor="start" fill="#4b5563" font-weight="700">ENCODER</text><text x="358" y="418" font-size="12" text-anchor="end" fill="#4b5563" font-weight="700">× N  (N = 6)</text><text x="462" y="288" font-size="12" text-anchor="start" fill="#4b5563" font-weight="700">DECODER</text><text x="748" y="288" font-size="12" text-anchor="end" fill="#4b5563" font-weight="700">× N  (N = 6)</text><rect x="80.0" y="700" width="270" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="215" y="721" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Embedding + positional encoding</text><text x="215" y="740" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">x ∈ ℝ^(n×d_model)</text><rect x="80.0" y="610" width="270" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="215" y="631" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Self-attention (no mask)</text><text x="215" y="650" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">softmax(QKᵀ/√d_k)V</text><rect x="80.0" y="565" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="215" y="584.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Add &amp; Norm</text><rect x="80.0" y="480" width="270" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="215" y="501" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Feed-forward network</text><text x="215" y="520" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="80.0" y="435" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="215" y="454.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Add &amp; Norm</text><rect x="470.0" y="700" width="270" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="605" y="721" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Embedding + positional encoding</text><text x="605" y="740" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">y_in ∈ ℝ^(m×d_model)</text><rect x="470.0" y="610" width="270" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="605" y="631" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Masked self-attention</text><text x="605" y="650" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">softmax(QKᵀ/√d_k + M)V</text><rect x="470.0" y="565" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="605" y="584.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Add &amp; Norm</text><rect x="470.0" y="480" width="270" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="605" y="501" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Cross-attention (no mask)</text><text x="605" y="520" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">softmax(Q_dec K_encᵀ/√d_k)V_enc</text><rect x="470.0" y="435" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="605" y="454.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Add &amp; Norm</text><rect x="470.0" y="350" width="270" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="605" y="371" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Feed-forward network</text><text x="605" y="390" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="470.0" y="305" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="605" y="324.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Add &amp; Norm</text><rect x="470.0" y="205" width="270" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="605" y="226" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Linear + softmax</text><text x="605" y="245" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">P(y_t | y_&lt;t, x) over the vocabulary</text><polyline points="215,700 215,662" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="215,610 215,595" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,700 605,662" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,610 605,595" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="215,565 215,532" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="215,480 215,465" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="215,435 215,385" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,565 605,532" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,480 605,465" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,435 605,402" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,350 605,335" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,305 605,257" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,205 605,178" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="215,676 363,676 363,580 351.0,580" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><polyline points="215,546 363,546 363,450 351.0,450" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><polyline points="605,676 753,676 753,580 741.0,580" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><polyline points="605,546 753,546 753,450 741.0,450" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><polyline points="605,416 753,416 753,320 741.0,320" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="190" y="376" font-size="12" text-anchor="middle" fill="#9a3412" font-weight="700">H_enc ∈ ℝ^(n×d_model)</text><polyline points="285,372 410,372 410,506 470.0,506" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ah)"/><text x="402" y="440" font-size="13" text-anchor="end" fill="#ea580c" font-weight="700">K, V</text><text x="597" y="553" font-size="13" text-anchor="end" fill="#ea580c" font-weight="700">Q</text><text x="605" y="168" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">next-token probabilities</text><text x="215" y="785" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">source tokens x₁ … xₙ</text><text x="605" y="785" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">target tokens, shifted right: ⟨bos⟩, y₁ … y_(m−1)</text><polyline points="215,771 215,752" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,771 605,752" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><text x="410" y="822" font-size="11" text-anchor="middle" fill="#4b5563">Original design: Post-Norm, i.e. each Add &amp; Norm computes LayerNorm(x + Sublayer(x)). Dashed arrows are residual connections.</text></svg>