<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 740 750" width="740" height="750" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Decoder-only Transformer (GPT-style)</title><desc id="d">Token embeddings feed a stack of L blocks, each with LayerNorm, masked self-attention and a residual addition, then LayerNorm, a feed-forward network and a residual addition; a final LayerNorm and linear head produce next-token logits.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0" y="140" width="740" height="750" fill="#ffffff"/><rect x="125" y="330" width="310" height="410" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 5"/><text x="137" y="348" font-size="12" text-anchor="start" fill="#4b5563" font-weight="700">BLOCK</text><text x="423" y="348" font-size="12" text-anchor="end" fill="#4b5563" font-weight="700">× L</text><rect x="145.0" y="765" width="270" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="280" y="786" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Embedding + positional encoding</text><text x="280" y="805" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">x ∈ ℝ^(n×d)</text><rect x="145.0" y="680" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="280" y="699.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">LayerNorm</text><rect x="145.0" y="590" width="270" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="280" y="611" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Masked self-attention</text><text x="280" y="630" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">softmax(QKᵀ/√d_k + M)V</text><circle cx="280" cy="560" r="11" fill="#fff" stroke="#374151" stroke-width="1.6"/><text x="280" y="565" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">+</text><rect x="145.0" y="490" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="280" y="509.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">LayerNorm</text><rect x="145.0" y="400" width="270" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="280" y="421" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Feed-forward network</text><text x="280" y="440" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">max(0, xW₁ + b₁)W₂ + b₂</text><circle cx="280" cy="370" r="11" fill="#fff" stroke="#374151" stroke-width="1.6"/><text x="280" y="375" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">+</text><rect x="145.0" y="275" width="270" height="30" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="280" y="294.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Final LayerNorm</text><rect x="145.0" y="205" width="270" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="280" y="226" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Linear head</text><text x="280" y="245" font-size="12" text-anchor="middle" fill="#374151" font-style="italic">logits ∈ ℝ^(n×|V|)</text><polyline points="280,765 280,710" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,680 280,642" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,590 280,571" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,549 280,520" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,490 280,452" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,400 280,381" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,359 280,305" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,275 280,257" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,205 280,180" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="280,728 422,728 422,560 292,560" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><polyline points="280,535 422,535 422,370 292,370" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="280" y="168" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">P(x_(t+1) | x_≤t)</text><text x="280" y="846" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">input tokens x₁ … xₙ</text><polyline points="280,832 280,817" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><text x="360" y="876" font-size="11" text-anchor="middle" fill="#4b5563">Decoder-only, Pre-Norm variant: x + Sublayer(LayerNorm(x)). Dashed arrows: residual connections.</text><rect x="465" y="420" width="250" height="170" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/><text x="477" y="442" font-size="12" text-anchor="start" fill="#111827" font-weight="700">What is gone vs. the original:</text><text x="477" y="461" font-size="12" text-anchor="start" fill="#111827">• no encoder</text><text x="477" y="480" font-size="12" text-anchor="start" fill="#111827">• no cross-attention</text><text x="477" y="499" font-size="12" text-anchor="start" fill="#111827"></text><text x="477" y="518" font-size="12" text-anchor="start" fill="#111827" font-weight="700">What stays:</text><text x="477" y="537" font-size="12" text-anchor="start" fill="#111827">• one causal mask over the</text><text x="477" y="556" font-size="12" text-anchor="start" fill="#111827">  whole sequence (prompt + output)</text><text x="477" y="575" font-size="12" text-anchor="start" fill="#111827">• the same block, repeated L times</text></svg>