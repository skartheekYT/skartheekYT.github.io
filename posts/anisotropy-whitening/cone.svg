<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="340" fill="white"/>
  <!-- Left: isotropic -->
  <g transform="translate(190,160)">
    <circle r="120" fill="#f4f6fa" stroke="#9aa4b5"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#9aa4b5"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#9aa4b5"/>
    <g fill="#3b5bdb">
      <circle cx="-85" cy="-30" r="5"/><circle cx="-40" cy="-95" r="5"/><circle cx="30" cy="-100" r="5"/>
      <circle cx="90" cy="-45" r="5"/><circle cx="105" cy="25" r="5"/><circle cx="60" cy="85" r="5"/>
      <circle cx="-10" cy="105" r="5"/><circle cx="-75" cy="70" r="5"/><circle cx="-105" cy="20" r="5"/>
      <circle cx="-30" cy="-30" r="5"/><circle cx="40" cy="20" r="5"/><circle cx="-20" cy="45" r="5"/>
    </g>
  </g>
  <text x="190" y="305" text-anchor="middle" font-weight="bold" fill="#2b8a3e">Isotropic</text>
  <text x="190" y="325" text-anchor="middle" fill="#444">directions spread evenly; random pairs ≈ 0 cosine</text>
  <!-- arrow -->
  <line x1="470" y1="160" x2="330" y2="160" stroke="#d9480f" stroke-width="2"/>
  <polygon points="330,160 342,154 342,166" fill="#d9480f"/>
  <text x="400" y="148" text-anchor="middle" fill="#d9480f">whitening</text>
  <!-- Right: anisotropic -->
  <g transform="translate(570,160)">
    <circle r="120" fill="#f4f6fa" stroke="#9aa4b5"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#9aa4b5"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#9aa4b5"/>
    <path d="M0,0 L-72.6,-95.6 A120,120 0 0 1 24.6,-117.5 Z" fill="#ffe3e3" opacity="0.9"/>
    <g fill="#e03131">
      <circle cx="-30" cy="-60" r="5"/>
      <circle cx="-12" cy="-80" r="5"/>
      <circle cx="-38" cy="-85" r="5"/>
      <circle cx="-5" cy="-55" r="5"/>
      <circle cx="-22" cy="-100" r="5"/>
      <circle cx="2" cy="-95" r="5"/>
      <circle cx="-45" cy="-70" r="5"/>
      <circle cx="-18" cy="-40" r="5"/>
      <circle cx="8" cy="-70" r="5"/>
    </g>
  </g>
  <text x="570" y="305" text-anchor="middle" font-weight="bold" fill="#c92a2a">Anisotropic</text>
  <text x="570" y="325" text-anchor="middle" fill="#444">vectors share a narrow cone; random pairs: high cosine</text>
</svg>
