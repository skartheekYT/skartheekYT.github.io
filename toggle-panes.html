<script>
/* Show/hide buttons for the left topics sidebar and the right "On this page" list.
   Only on wide screens (992px+); below that Quarto already folds both into menus.
   Each reader's choice is remembered in localStorage. */
(function () {
  var body = document.body;
  var sidebar = document.querySelector('#quarto-sidebar .sidebar-item');
  var toc = document.querySelector('#quarto-margin-sidebar #TOC');
  var main = document.querySelector('main.content');
  if (!main || (!sidebar && !toc)) return;

  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  var panes = [];
  if (sidebar) panes.push({ key: 'panes.hideSidebar', cls: 'hide-sidebar', label: 'Topics', icon: 'bi-layout-sidebar' });
  if (toc) panes.push({ key: 'panes.hideToc', cls: 'hide-toc', label: 'On this page', icon: 'bi-list-ul' });

  var bar = document.createElement('div');
  bar.className = 'pane-toggles';

  panes.forEach(function (p) {
    var stored = load(p.key);
    // Default: sidebar open; TOC hidden on tablet-width screens, open on wide desktops.
    var hidden = stored !== null
      ? stored === '1'
      : (p.cls === 'hide-toc' && window.innerWidth < 1400);
    body.classList.toggle(p.cls, hidden);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pane-toggle';
    btn.innerHTML = '<i class="bi ' + p.icon + '" aria-hidden="true"></i> <span>' + p.label + '</span>';

    function sync() {
      var isHidden = body.classList.contains(p.cls);
      btn.setAttribute('aria-pressed', String(!isHidden));
      btn.title = (isHidden ? 'Show ' : 'Hide ') + p.label.toLowerCase();
    }
    sync();

    btn.addEventListener('click', function () {
      var nowHidden = !body.classList.contains(p.cls);
      body.classList.toggle(p.cls, nowHidden);
      save(p.key, nowHidden ? '1' : '0');
      sync();
    });
    bar.appendChild(btn);
  });

  main.insertBefore(bar, main.firstChild);
})();
</script>
